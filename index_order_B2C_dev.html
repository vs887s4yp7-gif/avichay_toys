<style>
:root{
  --teal-deep:#2E93A0;
  --teal:#3FAEB8;
  --teal-light:#6FC9D0;
  --mint:#B7E9C6;
  --mint-dark:#7FCB9C;
  --mint-shadow:#6BB98A;
  --pink:#ED5E92;
  --pink-dark:#D4487C;
  --pink-soft:#FCE4EE;
  --yellow:#F2C94C;
  --yellow-dark:#D9A93A;
  --ink:#17394A;
  --ink-soft:#4A6B79;
  --cream:#F1FBFA;
  --card:#FFFFFF;
  --border:#E3F1F0;
  --radius-lg:28px;
  --radius-md:20px;
  --radius-sm:14px;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Assistant',sans-serif;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);padding-bottom:110px;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,.display{font-family:'Varela Round','Assistant',sans-serif;font-weight:400;}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px;}

/* ============ HERO ============ */
.hero{
  position:relative;
  background:linear-gradient(165deg,#3FAEB8 0%,#4FBAC2 45%,#63C6CC 100%);
  padding:30px 20px 42px;text-align:center;overflow:hidden;
  border-bottom-left-radius:36px;border-bottom-right-radius:36px;
}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.22),transparent 55%);pointer-events:none;}
.hero-inner{position:relative;z-index:2;max-width:600px;margin:0 auto;}

.deco{position:absolute;opacity:.55;z-index:1;user-select:none;pointer-events:none;}
.deco.s1{top:26px;right:8%;font-size:26px;color:#F2C94C;}
.deco.s2{top:74px;left:7%;font-size:20px;color:#FCE4EE;}
.deco.s3{bottom:64px;right:12%;font-size:18px;color:#FFFFFF;}
.deco.bubble{border-radius:50%;background:rgba(255,255,255,.14);}
.deco.b1{width:92px;height:92px;bottom:-24px;left:6%;}
.deco.b2{width:46px;height:46px;top:120px;right:4%;}

.logo-wrap{position:relative;width:min(56vw,238px);margin:0 auto 22px;}
.logo{
  width:100%;aspect-ratio:1/1;border-radius:50%;display:block;
  border:5px solid #fff;background:#fff;
  box-shadow:0 0 0 7px rgba(255,255,255,.22), 0 16px 34px rgba(10,60,72,.32);
  animation:float 4.2s ease-in-out infinite;
}
.logo-shadow{
  position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
  width:62%;height:14px;border-radius:50%;
  background:rgba(10,60,72,.22);filter:blur(7px);
  animation:floatShadow 4.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes floatShadow{0%,100%{transform:translateX(-50%) scale(1);opacity:.4}50%{transform:translateX(-50%) scale(.82);opacity:.22}}

.badge-pill{
  display:inline-block;background:var(--yellow);color:#5C4310;
  font-weight:700;font-size:.98rem;padding:9px 22px;border-radius:999px;
  box-shadow:0 4px 0 var(--yellow-dark);margin-bottom:18px;
}
.hero h1{color:#fff;font-size:clamp(1.4rem,5.4vw,2rem);line-height:1.38;margin-bottom:10px;
  text-shadow:0 2px 10px rgba(6,48,58,.25);}
.hero .sub{color:rgba(255,255,255,.93);font-size:1.02rem;margin-bottom:24px;}

.btn-cta{
  display:inline-block;border:0;cursor:pointer;font-family:'Varela Round',sans-serif;
  font-size:1.22rem;padding:17px 46px;border-radius:999px;width:min(100%,340px);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn-mint{background:var(--mint);color:#1B4B33;box-shadow:0 5px 0 var(--mint-shadow);}
.btn-cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2);}

/* ============ LAYOUT ============ */
.section{max-width:1240px;margin:0 auto;padding:30px 16px 4px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;}
.section-head h2{font-size:1.45rem;color:var(--ink);}
.section-head .hint{font-size:.88rem;color:var(--ink-soft);white-space:nowrap;}

.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.rail::-webkit-scrollbar{display:none;}
.rail > *{scroll-snap-align:start;}

/* category tiles */
.cat-tile{
  flex:0 0 auto;width:104px;background:var(--card);border:2px solid var(--border);
  border-radius:var(--radius-md);padding:15px 8px 12px;text-align:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(23,57,74,.05);transition:transform .15s,border-color .15s,box-shadow .15s;
}
.cat-tile:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(23,57,74,.1);}
.cat-tile .ico{width:60px;height:60px;border-radius:50%;
  background:linear-gradient(150deg,#E8F7F8,#D3EEF1);
  display:flex;align-items:center;justify-content:center;margin:0 auto 9px;
  box-shadow:inset 0 -2px 6px rgba(46,147,160,.12);}
.cat-tile .ico svg{width:38px;height:38px;display:block;}
.head-ico{width:26px;height:26px;flex:0 0 26px;}
.section-head h2{display:flex;align-items:center;gap:9px;}
.cat-tile .lbl{font-family:'Varela Round',sans-serif;font-size:.88rem;color:var(--ink);display:block;line-height:1.25;}
.cat-tile .cnt{font-size:.73rem;color:var(--ink-soft);}

/* search */
.search-wrap{position:relative;margin-bottom:6px;}
.search-input{width:100%;padding:16px 52px 16px 20px;border:2px solid var(--border);border-radius:999px;
  font-size:16px;outline:none;background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(23,57,74,.05);
  transition:border-color .2s,box-shadow .2s;}
.search-input::placeholder{color:#9CB7BF;}
.search-input:focus{border-color:var(--teal);box-shadow:0 6px 18px rgba(63,174,184,.18);}
.search-icon{position:absolute;top:50%;transform:translateY(-50%);right:20px;font-size:19px;opacity:.5;pointer-events:none;}

/* promo band */
.promo-band{background:linear-gradient(180deg,#FFF6DC 0%,#FFFDF6 100%);
  border-top:2px solid #F6E3AE;border-bottom:2px solid #F6E3AE;margin-top:26px;padding-bottom:6px;}
.promo-band .section{padding-top:26px;}
.promo-band .section-head h2{color:#8A6410;}

/* category sections */
.cat-section{padding-top:26px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:16px;}

/* ============ PRODUCT CARD ============ */
.product-card{
  background:var(--card);border-radius:var(--radius-lg);border:2px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 4px 14px rgba(23,57,74,.06);transition:transform .16s,box-shadow .16s,border-color .16s;
}
.rail .product-card{flex:0 0 auto;width:186px;}
.product-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(23,57,74,.12);}
.product-card.in-cart{border-color:var(--mint-dark);box-shadow:0 6px 20px rgba(127,203,156,.35);}

.img-container{position:relative;aspect-ratio:1/1;background:#EDF8F8;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.img-container img{width:100%;height:100%;object-fit:cover;}

.flag{position:absolute;top:10px;inset-inline-start:10px;z-index:3;font-weight:700;font-size:.72rem;
  padding:4px 11px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.flag-new{background:var(--yellow);color:#5C4310;}
.flag-promo{background:var(--pink);color:#fff;}

.out-of-stock-overlay{position:absolute;inset:0;background:rgba(23,57,74,.62);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Varela Round',sans-serif;font-size:1rem;}
.coming-soon-overlay{position:absolute;inset:0;background:rgba(63,174,184,.35);display:flex;align-items:center;justify-content:center;}
.coming-soon-badge{background:#fff;color:var(--teal-deep);padding:7px 15px;border-radius:999px;font-weight:700;font-size:.86rem;}

.product-info{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1;gap:5px;}
.product-sku{font-size:.7rem;color:#9CB7BF;}
.product-name{font-size:.98rem;color:var(--ink);line-height:1.3;}
.product-desc{font-size:.81rem;color:var(--ink-soft);line-height:1.4;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.product-price{font-family:'Varela Round',sans-serif;font-size:1.28rem;color:var(--pink);margin-top:2px;}
.product-price.no-price{font-size:.79rem;color:var(--ink-soft);font-family:'Assistant',sans-serif;line-height:1.35;}

.qty-controls{display:flex;align-items:center;gap:8px;margin-top:10px;}
.btn-qty{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;background:var(--mint);
  color:#1B4B33;font-size:1.3rem;cursor:pointer;font-family:'Varela Round',sans-serif;line-height:1;
  box-shadow:0 3px 0 var(--mint-shadow);transition:transform .1s;}
.btn-qty:active{transform:translateY(3px);box-shadow:none;}
.qty-input{flex:1;min-width:0;height:40px;border:2px solid var(--border);border-radius:var(--radius-sm);
  font-family:'Varela Round',sans-serif;font-size:1.05rem;color:var(--ink);background:#fff;}
.box-info{font-size:.75rem;color:var(--ink-soft);margin-top:8px;text-align:center;}

.out-of-stock-btn{margin-top:10px;background:#EEF3F4;color:#8FA6AE;text-align:center;padding:11px;border-radius:var(--radius-sm);font-weight:600;font-size:.85rem;}
.coming-soon-btn{margin-top:10px;background:#E3F5F6;color:var(--teal-deep);text-align:center;padding:11px;border-radius:var(--radius-sm);font-weight:600;font-size:.8rem;}
.last-items-btn{margin-top:10px;background:var(--pink-soft);color:var(--pink-dark);text-align:center;padding:9px;border-radius:var(--radius-sm);font-weight:700;font-size:.81rem;}
.blink{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:1.05rem;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .big{font-size:38px;display:block;margin-bottom:10px;}

/* ============ FLOATING ORDER BAR ============ */
.order-bar{
  position:fixed;inset-inline:0;bottom:0;z-index:80;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(241,251,250,.99) 55%,rgba(241,251,250,.6));
  backdrop-filter:blur(6px);
}
.btn-send{
  width:100%;max-width:620px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:11px;
  background:#25D366;color:#fff;border:0;cursor:pointer;
  font-family:'Varela Round',sans-serif;font-size:1.04rem;
  padding:16px 20px;border-radius:999px;
  box-shadow:0 8px 24px rgba(37,211,102,.42);
  transition:transform .14s,box-shadow .14s,background .2s;
}
.btn-send.empty{background:#9CC9B0;box-shadow:0 6px 18px rgba(156,201,176,.4);}
.btn-send:active{transform:translateY(2px);}
.btn-send svg{width:23px;height:23px;flex:0 0 23px;}
.btn-send .send-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.18;}
.btn-send .send-sub{font-family:'Assistant',sans-serif;font-weight:600;font-size:.79rem;opacity:.93;}

.toast{
  position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:.92rem;
  z-index:90;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px;}
  .section{padding:40px 24px 4px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>

<script>
let productsData = [];

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyseDc329NWupfxK0xQ1sKh2dMdfITWykaKSi4BeDtyGZIfcnqhY4LU7BAm5Z-CDa1xSA/exec';
const CLOUDINARY = 'https://res.cloudinary.com/dpwibhqcl/image/upload/';
const PHONE = '972548354668';

document.addEventListener('DOMContentLoaded', () => {
  fetchCatalog();
  document.getElementById('search').addEventListener('input', filterProducts);
});

/* ---------- helpers ---------- */
function goTo(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}
function normalizeKey(k){ return String(k).replace(/["'\s״׳\u05F3\u05F4]/g, ''); }
function cleanVal(v){ return String(v === null || v === undefined ? '' : v).replace(/[\u200E\u200F\u05F3\u05F4"'״׳]/g,'').trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* מחיר צרכן — עמיד לגרשיים/רווחים בשם העמודה */
function getConsumerPrice(row){
  for (const k in row){
    if (normalizeKey(k).indexOf('מחירצרכן') !== -1){
      const raw = String(row[k] === null || row[k] === undefined ? '' : row[k]).replace(/[₪,\s]/g,'');
      if (raw === '') continue;
      const v = parseFloat(raw);
      if (!isNaN(v) && v > 0) return v;
    }
  }
  return null;
}
function isPromo(row){
  for (const k in row){
    if (normalizeKey(k).indexOf('קידום') !== -1){
      return cleanVal(row[k]) === 'כן';
    }
  }
  return false;
}
function isNewRow(row){
  const v = cleanVal(row['אינדיקטור חדש']).toLowerCase();
  return v === 'כן' || v === '1' || v === 'true';
}
function auditColumns(products){
  if (!products.length) return;
  const keys = Object.keys(products[0]).map(normalizeKey);
  if (!keys.some(k => k.indexOf('מחירצרכן') !== -1))
    console.warn('[קטלוג] לא נמצאה עמודת "מחיר צרכן" — כל המוצרים יוצגו ללא מחיר. עמודות זמינות:', Object.keys(products[0]));
  if (!keys.some(k => k.indexOf('קידום') !== -1))
    console.warn('[קטלוג] לא נמצאה עמודת "קידום" — מקטע המומלצים יישאר ריק.');
}

/* ---------- data ---------- */
function fetchCatalog(){
  const cb = 'cb' + Date.now();
  const s = document.createElement('script');
  s.src = SCRIPT_URL + '?action=read&callback=' + cb + '&_=' + Date.now();

  const timer = setTimeout(function(){
    if (window[cb]){
      delete window[cb];
      try { document.head.removeChild(s); } catch(e){}
      document.getElementById('loading').textContent = 'החיבור לקטלוג נכשל. רעננו את הדף כדי לנסות שוב.';
    }
  }, 15000);

  window[cb] = function(data){
    clearTimeout(timer);
    try { document.head.removeChild(s); } catch(e){}
    delete window[cb];
    if (!data || !data.success){
      document.getElementById('loading').textContent = 'הקטלוג לא נטען. רעננו את הדף כדי לנסות שוב.';
      return;
    }
    productsData = (data.data || []).filter(r => {
      const sku = getSku(r), name = getName(r);
      return sku || name;
    });
    auditColumns(productsData);
    renderCategoryRail();
    renderPromoRail();
    renderCatalogSections();
    filterProducts();
    document.getElementById('loading').style.display = 'none';
  };

  s.onerror = function(){
    clearTimeout(timer);
    delete window[cb];
    document.getElementById('loading').textContent = 'אין חיבור לרשת. בדקו את החיבור ורעננו את הדף.';
  };
  document.head.appendChild(s);
}

function getSku(row){ return row['מק""ט (קטלוגי)'] || row['מק"ט (קטלוגי)'] || row['מק"ט'] || ''; }
function getName(row){ return row['שם מוצר'] || row['"שם מוצר"'] || row['תיאור פריט'] || ''; }
function getCat(row){ return (String(row['קטגוריה'] || row['"קטגוריה"'] || 'כללי')).trim() || 'כללי'; }

/* התאמה מדויקת לשמות הקטגוריות בגיליון */
const CAT_EXACT = {
  'צעצועים':'toys',
  'מפעילים':'activity',
  'חישה ויצירה':'sensory',
  'קיץ, ים ובריכה':'summer',
  'מסיבות ואירועים':'party',
  'דקורציה':'decor',
  'סוכות':'sukkot',
  'ספורט ומשחקי חוץ':'sport',
  'צעצועי אור וניאון':'neon',
  'תחפושות ופורים':'purim',
  'כללי':'gift',
  'כריסמס ונובי גוד':'christmas'
};
/* גיבוי לפי מילות מפתח, אם שם הקטגוריה ישתנה בגיליון */
const CAT_MAP = [
  [['מפעיל','סביבון','נגרר'],'activity'],
  [['חישה','יצירה','אומנות','אמנות','צביע','פלסטלינ'],'sensory'],
  [['קיץ','ים','בריכ','חוף','שחי','מתנפח'],'summer'],
  [['מסיב','אירוע','יום הולדת','חגיג','בלון'],'party'],
  [['דקורצי','קישוט','עיצוב'],'decor'],
  [['סוכות','סוכה','לולב','חג'],'sukkot'],
  [['ספורט','כדור','חוץ','גינה','חצר'],'sport'],
  [['ניאון','אור','זוהר','לד','לילה'],'neon'],
  [['תחפוש','פורים','מסכ','ליצן'],'purim'],
  [['כריסמס','נובי','חג המולד','אשוח'],'christmas'],
  [['צעצוע','משחק','בוב','דמות'],'toys']
];

function iconFor(cat){
  const c = String(cat).trim();
  if (CAT_EXACT[c]) return ICONS[CAT_EXACT[c]];
  for (let i = 0; i < CAT_MAP.length; i++){
    const keys = CAT_MAP[i][0];
    for (let j = 0; j < keys.length; j++){
      if (c.indexOf(keys[j]) !== -1) return ICONS[CAT_MAP[i][1]];
    }
  }
  return ICONS.gift;
}
function categoryList(){
  const set = [];
  productsData.forEach(row => {
    const c = getCat(row);
    if (c && set.indexOf(c) === -1) set.push(c);
  });
  return set;
}
function catId(cat){ return 'cat-' + categoryList().indexOf(cat); }

function renderCategoryRail(){
  const rail = document.getElementById('cat-rail');
  let html = '';
  categoryList().forEach(cat => {
    const count = productsData.filter(p => getCat(p) === cat).length;
    html += '<button class="cat-tile" onclick="goTo(\'' + catId(cat) + '\')">' +
              '<span class="ico">' + iconFor(cat) + '</span>' +
              '<span class="lbl">' + esc(cat) + '</span>' +
              '<span class="cnt">' + count + ' מוצרים</span>' +
            '</button>';
  });
  rail.innerHTML = html;
}

/* ---------- product card ---------- */
function cardHtml(row){
  const sku = getSku(row);
  const name = getName(row);
  const desc = row['תיאור מוצר'] || row['"תיאור מוצר"'] || '';
  const boxQty = parseInt(row['כמות במארז'] || row['"כמות במארז"'] || 1) || 1;
  const stockVal = cleanVal(row['מלאי']);
  const price = getConsumerPrice(row);
  const hasPrice = price !== null;
  const promo = isPromo(row);
  const isNew = isNewRow(row);

  const cleanSku = String(sku).trim().toLowerCase().replace(/\.(jpg|jpeg|png|webp)$/i, '');
  const imgSrc = cleanSku ? (CLOUDINARY + cleanSku + '.jpg') : '';

  let flag = '';
  if (promo) flag = '<span class="flag flag-promo">מומלץ</span>';
  else if (isNew) flag = '<span class="flag flag-new">חדש</span>';

  return '<div class="product-card" data-sku="' + esc(sku) + '" data-name="' + esc(name) + '" ' +
         'data-price="' + (hasPrice ? price : '') + '" data-box="' + boxQty + '" ' +
         'data-category="' + esc(getCat(row)) + '" data-stock="' + esc(stockVal) + '">' +
    '<div class="img-container">' + flag +
      '<img src="' + imgSrc + '" alt="' + esc(name) + '" loading="lazy" onerror="this.style.display=\'none\'">' +
      buildImageOverlay(stockVal) +
    '</div>' +
    '<div class="product-info">' +
      '<span class="product-sku">מק״ט ' + esc(sku) + '</span>' +
      '<h3 class="product-name">' + esc(name) + '</h3>' +
      '<p class="product-desc">' + esc(desc) + '</p>' +
      '<div class="product-price' + (hasPrice ? '' : ' no-price') + '">' +
        (hasPrice ? '₪' + price.toFixed(2) : 'בחרו כמות ונחזור אליכם עם מחיר וזמינות') +
      '</div>' +
      buildOrderControls(stockVal, boxQty) +
    '</div>' +
  '</div>';
}

function buildImageOverlay(stockVal){
  if (stockVal === 'אין') return '<div class="out-of-stock-overlay">אזל מהמלאי</div>';
  if (stockVal === 'בקרוב') return '<div class="coming-soon-overlay"><span class="coming-soon-badge">✨ מגיע בקרוב</span></div>';
  return '';
}

function buildOrderControls(stockVal, boxQty){
  if (stockVal === 'אין') return '<div class="out-of-stock-btn">לא זמין להזמנה</div>';
  if (stockVal === 'בקרוב') return '<div class="coming-soon-btn">✨ מגיע בקרוב — עדיין לא ניתן להזמין</div>';

  const qtyHtml = '<div class="qty-controls">' +
    '<button class="btn-qty" onclick="changeQty(this,1)" aria-label="הוספת יחידות">+</button>' +
    '<input type="number" class="qty-input" value="0" min="0" readonly style="text-align:center" aria-label="כמות">' +
    '<button class="btn-qty" onclick="changeQty(this,-1)" aria-label="הפחתת יחידות">−</button>' +
    '</div><div class="box-info">📦 ' + boxQty + ' יח׳ במארז</div>';

  if (stockVal === 'כמעט נגמר') return '<div class="last-items-btn blink">⚡ פריטים אחרונים</div>' + qtyHtml;
  return qtyHtml;
}

/* ---------- rendering sections ---------- */
function renderPromoRail(){
  const promos = productsData.filter(isPromo).filter(r => getConsumerPrice(r) !== null);
  if (!promos.length) return;
  document.getElementById('promo-band').style.display = 'block';
  document.getElementById('promo-rail').innerHTML = promos.map(cardHtml).join('');
  document.getElementById('promo-count').textContent = promos.length + ' מוצרים';
}

function renderCatalogSections(){
  const wrap = document.getElementById('catalog-sections');
  let html = '';
  categoryList().forEach(cat => {
    const items = productsData.filter(p => getCat(p) === cat);
    html += '<section class="section cat-section" id="' + catId(cat) + '" data-cat-section="' + esc(cat) + '">' +
              '<div class="section-head"><h2><span class="head-ico">' + iconFor(cat) + '</span>' + esc(cat) + '</h2>' +
              '<span class="hint">' + items.length + ' מוצרים</span></div>' +
              '<div class="grid">' + items.map(cardHtml).join('') + '</div>' +
            '</section>';
  });
  wrap.innerHTML = html;
}

/* ---------- cart ---------- */
function changeQty(btn, direction){
  const card = btn.closest('.product-card');
  const input = card.querySelector('.qty-input');
  if (!input) return;
  const boxQty = parseInt(card.getAttribute('data-box')) || 1;
  let val = parseInt(input.value) || 0;
  val = direction === 1 ? val + boxQty : Math.max(0, val - boxQty);

  /* אותו מוצר יכול להופיע גם במומלצים וגם בקטלוג — מסנכרנים לפי מק״ט */
  const sku = card.getAttribute('data-sku');
  document.querySelectorAll('.product-card[data-sku="' + CSS.escape(sku) + '"]').forEach(c => {
    const inp = c.querySelector('.qty-input');
    if (inp) inp.value = val;
    c.classList.toggle('in-cart', val > 0);
  });
  updateCartTotals();
}

function cartLines(){
  const seen = {};
  const lines = [];
  document.querySelectorAll('.product-card').forEach(card => {
    const sku = card.getAttribute('data-sku');
    if (seen[sku]) return;
    const inp = card.querySelector('.qty-input');
    if (!inp) return;
    const qty = parseInt(inp.value) || 0;
    if (qty <= 0) return;
    seen[sku] = true;
    const raw = card.getAttribute('data-price');
    const hasPrice = raw !== '' && !isNaN(parseFloat(raw));
    lines.push({sku, name: card.getAttribute('data-name'), qty, hasPrice, price: hasPrice ? parseFloat(raw) : 0});
  });
  return lines;
}

function updateCartTotals(){
  const lines = cartLines();
  const items = lines.reduce((s,l) => s + l.qty, 0);
  const total = lines.reduce((s,l) => s + l.qty * l.price, 0);

  const btn = document.getElementById('btn-send');
  btn.classList.toggle('empty', items === 0);

  document.getElementById('send-txt').innerHTML = items > 0
    ? 'שליחת הזמנה בוואטסאפ<span class="send-sub">' + items + ' פריטים • סה״כ ₪' +
      total.toLocaleString('he-IL', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>'
    : 'שליחת הזמנה בוואטסאפ<span class="send-sub">הסל ריק — 0 פריטים</span>';
}

/* ---------- search ---------- */
function filterProducts(){
  const query = document.getElementById('search').value.toLowerCase().trim();
  let totalVisible = 0;

  document.querySelectorAll('.product-card').forEach(card => {
    const sku = (card.getAttribute('data-sku') || '').toLowerCase();
    const name = (card.getAttribute('data-name') || '').toLowerCase();
    const match = !query || sku.indexOf(query) !== -1 || name.indexOf(query) !== -1;
    card.style.display = match ? 'flex' : 'none';
  });

  document.querySelectorAll('[data-cat-section]').forEach(sec => {
    const visible = sec.querySelectorAll('.product-card:not([style*="none"])').length;
    sec.style.display = visible ? 'block' : 'none';
    totalVisible += visible;
    const hint = sec.querySelector('.hint');
    if (hint) hint.textContent = visible + ' מוצרים';
  });

  const band = document.getElementById('promo-band');
  if (band.getAttribute('data-has-items') !== 'no'){
    const promoVisible = document.querySelectorAll('#promo-rail .product-card:not([style*="none"])').length;
    if (document.getElementById('promo-rail').children.length){
      band.style.display = promoVisible ? 'block' : 'none';
    }
  }

  document.getElementById('global-empty').style.display = (totalVisible === 0 && productsData.length) ? 'block' : 'none';
  document.getElementById('result-count').textContent = totalVisible + ' מוצרים';
}

/* ---------- order ---------- */
function sendOrder(){
  const lines = cartLines();
  if (!lines.length){
    toast('בחרו לפחות מוצר אחד לפני שליחת ההזמנה');
    goTo('catalog');
    return;
  }

  let grandTotal = 0, pending = 0;
  const parts = lines.map(l => {
    if (l.hasPrice){
      const t = l.qty * l.price;
      grandTotal += t;
      return '• *[' + l.sku + ']* ' + l.name + '\n  כמות: ' + l.qty + ' | מחיר: ₪' + l.price + ' | סה"כ: ₪' + t;
    }
    pending++;
    return '• *[' + l.sku + ']* ' + l.name + '\n  כמות: ' + l.qty + ' | מחיר: לבירור מחיר וזמינות';
  });

  let message = 'שלום, אשמח לבצע הזמנה עבור הפריטים הבאים:\n\n' + parts.join('\n\n');
  message += '\n\n─────────────────\n*💵 סך הכל לתשלום: ₪' + grandTotal.toLocaleString('he-IL') + '*';
  if (pending > 0) message += '\n_(לא כולל ' + pending + ' פריטים לבירור מחיר וזמינות)_';
  message += '\n\nתודה!';

  gtag('event', 'send_order', {
    'event_category': 'orders',
    'event_label': 'whatsapp_send',
    'value': grandTotal
  });
  const url = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(message);
  setTimeout(function(){ window.open(url, '_blank'); }, 300);
}
</script>
